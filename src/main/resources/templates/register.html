<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考勤管理系统 - 注册</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .register-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 480px;
        }
        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .register-header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .register-header p {
            color: #666;
            font-size: 14px;
        }
        .form-floating {
            margin-bottom: 20px;
        }
        .form-floating input {
            height: 52px;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        .form-floating input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn-register {
            width: 100%;
            height: 52px;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-register:active {
            transform: translateY(0);
        }
        .register-footer {
            text-align: center;
            margin-top: 25px;
        }
        .register-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .register-footer a:hover {
            text-decoration: underline;
        }
        .alert-message {
            display: none;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .icon-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .icon-wrapper svg {
            width: 40px;
            height: 40px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <div class="icon-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
            </div>
            <h1>注册新账号</h1>
            <p>创建您的考勤系统账号</p>
        </div>

        <div class="alert alert-danger alert-message" id="errorAlert" role="alert">
            <strong>注册失败：</strong><span id="errorMessage"></span>
        </div>

        <div class="alert alert-success alert-message" id="successAlert" role="alert">
            <strong>注册成功！</strong>正在跳转到登录页面...
        </div>

        <form id="registerForm">
            <div class="form-floating">
                <input type="text" class="form-control" id="username" placeholder="用户名" required>
                <label for="username">用户名</label>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control" id="password" placeholder="密码" required>
                <label for="password">密码</label>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control" id="confirmPassword" placeholder="确认密码" required>
                <label for="confirmPassword">确认密码</label>
            </div>
            <div class="form-floating">
                <select class="form-control" id="userRole" required>
                    <option value="" disabled selected>请选择角色</option>
                    <option value="student">学生</option>
                    <option value="teacher">教师</option>
                </select>
                <label for="userRole">角色</label>
            </div>
            <button type="submit" class="btn btn-register">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2">
                    <path d="M12 5v14"></path>
                    <path d="M5 12h14"></path>
                </svg>
                注册
            </button>
        </form>

        <div class="register-footer">
            <p>已有账号？<a href="/login">立即登录</a></p>
        </div>
    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", function(e) {
            e.preventDefault();
            
            const errorAlert = document.getElementById("errorAlert");
            const successAlert = document.getElementById("successAlert");
            errorAlert.style.display = "none";
            successAlert.style.display = "none";
            
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const userRole = document.getElementById("userRole").value;

            if (password !== confirmPassword) {
                document.getElementById("errorMessage").textContent = "两次输入的密码不一致";
                errorAlert.style.display = "block";
                return;
            }

            if (!userRole) {
                document.getElementById("errorMessage").textContent = "请选择角色";
                errorAlert.style.display = "block";
                return;
            }

            fetch("/user/add", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password, userRole })
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    successAlert.style.display = "block";
                    setTimeout(() => {
                        location.href = "/login";
                    }, 2000);
                } else {
                    document.getElementById("errorMessage").textContent = "注册失败";
                    errorAlert.style.display = "block";
                }
            })
            .catch(error => {
                document.getElementById("errorMessage").textContent = "注册失败";
                errorAlert.style.display = "block";
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
