<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>注册</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family: "Microsoft YaHei"}
        body {background:#f0f2f5;display:flex;justify-content:center;align-items:center;height:100vh}
        .box {background:white;padding:30px;border-radius:8px;width:400px;box-shadow:0 2px 10px #0000001a}
        h2 {text-align:center;margin-bottom:20px;color:#1a73e8}
        .form-group {margin-bottom:15px}
        label {display:block;margin-bottom:5px}
        input {width:100%;padding:10px;border:1px solid #ddd;border-radius:4px}
        button {width:100%;padding:10px;background:#1a73e8;color:white;border:none;border-radius:4px;margin-top:10px}
        .tip {text-align:center;margin-top:15px}
        a {color:#1a73e8}
    </style>
</head>
<body>
<div class="box">
    <h2>用户注册</h2>
    <form id="regForm">
        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="username">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="password">
        </div>
        <div class="form-group">
            <label>确认密码</label>
            <input type="password" id="confirmPassword">
        </div>
        <button type="submit">注册</button>
        <div class="tip">已有账号 <a href="/login">去登录</a></div>
    </form>
</div>

<script>
    document.getElementById("regForm").addEventListener("submit", function(e){
        e.preventDefault();
        let username = document.getElementById("username").value;
        let password = document.getElementById("password").value;
        let confirmPassword = document.getElementById("confirmPassword").value;

        fetch("/jpa/user/register", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({username, password, confirmPassword})
        }).then(res=>res.json())
          .then(data=>{
            alert("注册成功");
            location.href="/login";
        })
    });
</script>
</body>
</html>
