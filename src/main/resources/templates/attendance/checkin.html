<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>考勤打卡</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!-- 引用你现有的导航栏 → 完全匹配 -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <h3>课堂打卡</h3>
    <div class="card mt-3 p-4" style="max-width: 500px;">
        <div class="mb-3">
            <label>用户ID</label>
            <input type="text" id="userId" class="form-control" value="1" readonly>
        </div>
        <div class="mb-3">
            <label>选择课程</label>
            <select id="courseId" class="form-control">
                <option th:each="course : ${courses}"
                        th:value="${course.courseId}"
                        th:text="${course.courseName}"></option>
            </select>
        </div>

        <button class="btn btn-primary me-2" onclick="checkIn()">签到</button>
        <button class="btn btn-outline-warning" onclick="checkOut()">签退</button>
        <div id="msg" class="mt-3"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0.min.js"></script>
<script>
    function checkIn() {
        let userId = $("#userId").val();
        let courseId = $("#courseId").val();
        $.post("/attendance/doCheckIn", {userId, courseId}, function(res) {
            $("#msg").text(res);
        });
    }
    function checkOut() {
        let userId = $("#userId").val();
        let courseId = $("#courseId").val();
        $.post("/attendance/doCheckOut", {userId, courseId}, function(res) {
            $("#msg").text(res);
        });
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
