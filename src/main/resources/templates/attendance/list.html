<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>考勤记录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!-- 引用你现有的导航栏 → 完全匹配 -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <h3>我的考勤记录</h3>
    <table class="table table-bordered table-hover mt-3">
        <tr>
            <th>ID</th>
            <th>课程ID</th>
            <th>打卡日期</th>
            <th>签到时间</th>
            <th>签退时间</th>
            <th>状态</th>
        </tr>
        <tr th:each="record : ${records.content}">
            <td th:text="${record.attendanceId}"></td>
            <td th:text="${record.courseId}"></td>
            <td th:text="${record.attendanceDate}"></td>
            <td th:text="${record.checkinTime}"></td>
            <td th:text="${record.checkoutTime}"></td>
            <td th:text="${record.status}"></td>
        </tr>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
