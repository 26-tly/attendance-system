spring.application.name=attendance-system
# ==================== SQL Server 数据库配置 ====================
# 驱动类名
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# 数据库URL，包含服务器地址、端口号和数据库名称
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=attendance_system;encrypt=true;trustServerCertificate=true
# 用户名sa
spring.datasource.username=sa
# 密码sa密码
spring.datasource.password=tly050826

# ==================== 日志相关配置 ====================
logging.level.org.springframework=INFO
logging.level.com.example.attendance=DEBUG

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

spring.thymeleaf.cache=false

# 服务器配置
server.port=8080
server.address=0.0.0.0
server.tomcat.uri-encoding=UTF-8

# 字符编码配置
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
spring.servlet.encoding.enabled=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

file.upload.path=D:/upload/excel/
file.upload.suffix=.xls,.xlsx

# JWT配置
jwt.secret=attendance-system-secret-key-must-be-at-least-32-chars-for-security
jwt.expire-time=86400000
